<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Art Gallery</title>
    
    <!-- Import Model Viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        model-viewer {
            width: 100%;
            height: 500px;
            margin: 20px 0;
            background-color: #f0f0f0;
        }

        .gallery {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .model-container {
            margin-bottom: 40px;
        }

        h1, h2 {
            text-align: center;
            color: #333;
        }

        .description {
            text-align: center;
            margin: 10px 0;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="gallery">
        <h1>AR Art Gallery</h1>

        <div class="model-container">
            <h2>Artwork 1</h2>
            <model-viewer
                src="./Fish.glb"
                ios-src="./Fish.usdz"
                alt="3D artwork display"
                ar
                ar-modes="webxr scene-viewer quick-look"
                ar-scale="bounded"
                min-scale="0.01"
                max-scale="0.1"
                scale="0.1 0.1 0.1"
                orientation="0deg 0deg 180deg"
                camera-orbit="0deg 90deg 2m"
                camera-controls
                auto-rotate
                poster="./poster.png"
                exposure="1"
                shadow-intensity="1"
                shadow-softness="0.7"
                environment-image="neutral"               
                id="artwork1">
            </model-viewer>
            <p class="description">Interactive 3D artwork with AR capabilities</p>
        </div>
    </div>
</body>
</html>
